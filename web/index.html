<style>

}
:root[data-theme="dark"] {

}
:root[data-theme="light"] {
  --bg: #e9ecf2; --panel: #ffffff; --border: #d6dae3; --text: #1f2530; --dir: #0f1a33;
  --sel: #b35c00; --cur-bg: #d9e6ff; --cur-fg: #0a2a66; --dim: #6a7386; --bar-bg: #f3f5fa; --bar-fg: #1f2530;
  --bar-num: #1a62d6; --bar-num-fg: #ffffff; --warn: #c62828; --ok: #1b7f3b; --dlg-bg: #ffffff; --dlg-fg: #1b212c;
  --dlg-border: #d6dae3; --input-bg: #f3f5fa; --input-fg: #1b212c; --danger-bg: #fdecec;
  --accent: #1a62d6; --on-accent: #ffffff; --surface2: #f3f5fa; --err-bg: #fdecec; --err-fg: #7a1212; --shadow: rgba(30,40,70,.28);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 15px/20px ui-monospace, "DejaVu Sans Mono", Consolas, "Liberation Mono", monospace; overflow: hidden; }
#app { height: 100%; display: flex; flex-direction: column; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); gap: 6px; }
#top { display: flex; align-items: center; gap: 10px; color: var(--border); flex: none; }
#top b { color: var(--dir); }
#top .sp { flex: 1; }
#credit { flex: none; text-align: center; font-size: 12px; color: var(--dim, var(--border)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); display: inline-block; }
#dot.off { background: var(--warn); }
button { font: inherit; cursor: pointer; }
.tb { background: transparent; color: var(--border); border: 1px solid var(--border); padding: 0 10px; height: 26px; }
.tb:hover { background: var(--cur-bg); color: var(--cur-fg); }
#unsafeTag { color: var(--warn); font-weight: bold; display: none; }
body.unsafe #unsafeTag { display: inline; }
#panels { flex: 1; min-height: 0; display: flex; gap: 6px; }
.panel { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--panel);

.panel.active .ph { background: var(--cur-bg); color: var(--cur-fg); }
.panel.danger1 { background: var(--danger-bg); }
.ph { text-align: center; color: var(--dir); padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; flex: none; cursor: pointer; }

.pq { white-space: normal; }
.pitem { margin-bottom: 12px; }

.dlg h3 { margin: 0; text-align: center; font-size: 15px; }
.dlg .body { overflow: auto; white-space: pre-wrap; word-break: break-word; min-height: 0; }

.hostbox { flex-wrap: nowrap; align-items: stretch; justify-content: stretch; }
.hostbox input { flex: 1; min-width: 0; }

.mrow { display: flex; justify-content: center; gap: 28px; flex-wrap: wrap; }

<div id="app">

    <span><b>PS4 Commander</b> <span id="ver">__VERSION__</span></span>

    <span id="unsafeTag"></span>

    <button class="tb" id="btnMenu"></button>
  </div>
  <div id="panels"></div>
  <div id="msg"></div>
  <div id="keys"></div>
  <div id="credit">ps4commander v__VERSION__ · Created by SergioPoverony and Mr.Claude · GPLv3</div>
</div>
<div id="overlay"></div>
<input type="file" id="file" multiple style="display:none">
<script>
'use strict';
// ---------- переводы (встроены: страница самодостаточна) ----------
// Переводы лежат в отдельных файлах lang/<код>.json (общие с будущим PKG-приложением); список языков - /lang/index.json
let TR = {}, LANGS = [], lang = 'en';
async function loadLang(code) {
  if (!TR[code]) { const r = await fetch('/lang/' + code + '.json'); if (!r.ok) throw new Error('lang'); TR[code] = await r.json(); }
}
async function initLang() {
  try { LANGS = await (await fetch('/lang/index.json')).json(); } catch (e) { LANGS = []; }
  const codes = LANGS.map(x => x.code);
  let want = '';
  try { want = localStorage.getItem('fm_lang') || ''; } catch (e) {}
  if (!codes.includes(want)) { const nav = (navigator.language || '').toLowerCase().split('-')[0]; want = codes.includes(nav) ? nav : 'en'; }
  try { await loadLang('en'); } catch (e) {}
  try { await loadLang(want); lang = want; } catch (e) { lang = 'en'; }
}
// тему подставляет сервер прямо в страницу (data-theme), поэтому при загрузке ничего не мигает
let theme = document.documentElement.getAttribute('data-theme');
if (theme !== 'dark' && theme !== 'light') theme = 'classic';
function t(k, p) {
  let s = (TR[lang] && TR[lang][k]) ?? (TR.en && TR.en[k]) ?? k;
  if (p) for (const q in p) s = s.split('{' + q + '}').join(p[q]);
  return s;
}
function errText(code) { return t('e_' + code) !== 'e_' + code ? t('e_' + code) : (code && /^E[A-Z0-9]+$/.test(code) ? code : t('e_generic') + (code ? ': ' + code : '')); }

// ---------- вспомогательное ----------
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] === true) e.setAttribute(k, '');
    else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
function fmtSize(n) {
  if (n < 1024) return n + ' B';
  const u = ['KB', 'MB', 'GB', 'TB'];
  let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2)) + ' ' + u[i];
}
function fmtDate(sec) {
  if (!sec) return '';
  const d = new Date(sec * 1000), p = x => String(x).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function fmtTime(s) { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60); return m ? m + ':' + String(s % 60).padStart(2, '0') : s + ' s'; }
function join(dir, name) { return dir === '/' ? '/' + name : dir + '/' + name; }
function baseName(p) { const i = p.lastIndexOf('/'); return i < 0 ? p : p.slice(i + 1); }
function parentOf(p) { const i = p.lastIndexOf('/'); return i <= 0 ? '/' : p.slice(0, i); }

let unsafeMode = false;
let busyUI = false;

async function api(path, body, method) {
  let r;
  try {
    const opts = body !== undefined ? { method: 'POST', headers: { 'X-Requested-With': 'ps4cmd', 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {};
    r = await fetch(path, opts);
  } catch (e) { setConn(false); throw Object.assign(new Error('noconn'), { code: 'noconn' }); }
  setConn(true);
  const txt = await r.text();
  let j = null;
  try { j = JSON.parse(txt); } catch (e) {}
  if (!r.ok) throw Object.assign(new Error((j && j.error) || 'http' + r.status), { code: (j && j.error) || 'http' + r.status });
  return j;
}
function setConn(ok) { $('#dot').classList.toggle('off', !ok); $('#dot').title = ok ? '' : t('noConn'); }
let msgTimer = 0, flashing = false;
// Строка под панелями: сообщение на 6 секунд, а в остальное время полное имя выбранного файла или папки (имена бывают длинными).
function showName() {
  if (flashing) return;

// ---------- редактор текста ----------
async function editFile(p, e, createNew) {
  const path = join(p.path, e.n);
  let text = '', crlf = false;
  if (!createNew) {
    if (e.t !== 'f') return;
    if (e.s > 1048576) { messageBox(t('tooBig'), true); return; }
    try {
      const r = await fetch('/api/view?path=' + encodeURIComponent(path) + '&off=0&len=1048576');
      if (!r.ok) { let c = 'http' + r.status; try { c = (await r.json()).error || c; } catch (x) {} throw Object.assign(new Error(c), { code: c }); }
      const buf = new Uint8Array(await r.arrayBuffer());
      for (let i = 0; i < Math.min(buf.length, 8192); i++) if (buf[i] === 0) { messageBox(t('binaryNoEdit'), true); return; }
      text = new TextDecoder('utf-8').decode(buf);
    } catch (er) { messageBox(errText(er.code), true); return; }
    crlf = text.includes('\r\n');
  }
  const ta = h('textarea', { class: 'viewer', spellcheck: 'false', style: 'resize:none;white-space:pre;overflow:auto;width:100%;font:inherit;font-size:13px;line-height:17px;border:0;outline:0' });
  ta.value = crlf ? text.replace(/\r\n/g, '\n') : text;
  const st = h('div', { class: 'kv' }, fmtSize(new Blob([text]).size));
  let dirty = false;
  ta.addEventListener('input', () => { dirty = true; st.textContent = '*'; });
  const save = async () => {
    const body = crlf ? ta.value.replace(/\n/g, '\r\n') : ta.value;
    try { await putFile(path, new Blob([body]), !createNew || dirty, null); dirty = false; createNew = false; st.textContent = t('saved') + ' (' + fmtSize(new Blob([body]).size) + ')'; await load(p, p.path, e.n); }
    catch (er) { messageBox(errText(er.code), true); }
  };
  const close = () => { if (dirty) confirmBox(t('edit'), t('unsavedQ'), t('close'), closeDlg, true); else closeDlg(); };
  const d = h('div', { class: 'dlg wide' }, h('h3', null, e.n), st, ta, h('div', { class: 'btns' },
    h('button', { class: 'primary', onclick: save }, t('save') + ' (Ctrl+S)'), h('button', { onclick: close }, t('close'))));
  openDlg(d);
  ta.focus();
  d.addEventListener('keydown', ev => {
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's') { ev.preventDefault(); save(); }
    else if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); close(); }
    else if (ev.key === 'Tab') { ev.preventDefault(); const a = ta.selectionStart; ta.setRangeText('\t', a, ta.selectionEnd, 'end'); dirty = true; st.textContent = '*'; }
  });
}
function doEdit() { const p = panels[active], e = p.view[p.cur]; if (e && !e.up) editFile(p, e, false); }

async function viewFile(p, e) {

  const bHex = h('button', { onclick: () => { mode = 'hex'; load1(); } }, t('viewHex'));
  const bPrev = h('button', { onclick: () => { off = Math.max(0, off - CH); load1(); } }, t('prev'));
  const bNext = h('button', { onclick: () => { if (off + CH < size) { off += CH; load1(); } } }, t('next'));
  const bDl = h('button', { onclick: doDownload }, t('download'));
  const bClose = h('button', { class: 'primary', onclick: closeDlg }, t('close'));
  const d = h('div', { class: 'dlg wide' }, h('h3', null, e.n), info, pre, h('div', { class: 'btns' }, bText, bHex, bPrev, bNext, bDl, bClose));

      : h(media, { src, controls: true, style: 'max-width:100%;max-height:100%;display:block;margin:auto' }));
    pre.style.display = 'flex'; pre.style.alignItems = 'center'; pre.style.whiteSpace = 'normal';
    info.textContent = fmtSize(e.s);
    bPrev.style.display = bNext.style.display = 'none';
  } else load1();
  async function load1() {
    pre.textContent = t('loading');
    try {
      const r = await fetch('/api/view?path=' + encodeURIComponent(path) + '&off=' + off + '&len=' + CH);
      if (!r.ok) { let c = 'http' + r.status; try { c = (await r.json()).error || c; } catch (x) {} throw Object.assign(new Error(c), { code: c }); }
      size = +r.headers.get('X-File-Size') || size;

      let bin = false;

      const m = mode === 'auto' ? (bin ? 'hex' : 'text') : mode;

        for (let i = 0; i < buf.length; i += 16) {
          let hx = '', as = '';
          for (let k = 0; k < 16; k++) {
            if (i + k < buf.length) { const b = buf[i + k]; hx += b.toString(16).padStart(2, '0') + ' '; as += b >= 32 && b < 127 ? String.fromCharCode(b) : '.'; } else hx += '   ';
            if (k === 7) hx += ' ';
          }
          lines.push((off + i).toString(16).padStart(8, '0') + '  ' + hx + ' ' + as);
        }
        pre.textContent = lines.join('\n');
      } else {
        pre.textContent = new TextDecoder('utf-8', { fatal: false }).decode(buf);
      }
      pre.style.display = ''; pre.style.whiteSpace = 'pre';
      info.textContent = fmtSize(size) + '   ' + off + '..' + (off + buf.length) + ' (' + m + ')';
      bPrev.disabled = off === 0; bNext.disabled = off + CH >= size;
    } catch (er) { pre.textContent = errText(er.code); }
  }
}

// ---------- переходы, меню, справка ----------
async function showRoots() {
  let j;
  try { j = await api('/api/roots'); } catch (e) { return; }
  const p = panels[active];
  const list = j.roots.map(r => h('button', { onclick: () => { closeDlg(); load(p, r.p, null); } }, r.p));
  const d = h('div', { class: 'dlg' }, h('h3', null, t('rootsTitle')), h('div', { class: 'btns' }, list), h('div', { class: 'btns' }, h('button', { onclick: () => { closeDlg(); gotoPath(p); } }, t('gotoLabel').replace(/:$/, '...')), h('button', { onclick: () => { closeDlg(); showSmb(); } }, t('smbTitle')), h('button', { class: 'primary', onclick: closeDlg }, t('cancel'))));
  openDlg(d);
}
function showMenu() {
  const body = [];
  const unsafeCb = h('input', { type: 'checkbox' });
  unsafeCb.checked = unsafeMode;
  unsafeCb.addEventListener('change', () => { setUnsafe(unsafeCb.checked); });
  const themeSel = h('select', null, h('option', { value: 'classic' }, t('themeClassic')), h('option', { value: 'dark' }, t('themeDark')), h('option', { value: 'light' }, t('themeLight')));
  themeSel.value = theme;
  themeSel.addEventListener('change', () => { theme = themeSel.value; applyTheme(); api('/api/state', { theme }).catch(() => {}); });
  const langSel = h('select', null, ...(LANGS.length ? LANGS : [{ code: 'en', name: 'English' }]).map(x => h('option', { value: x.code }, x.name)));
  langSel.value = lang;
  langSel.addEventListener('change', async () => { try { await loadLang(langSel.value); } catch (e) { return; } lang = langSel.value; try { localStorage.setItem('fm_lang', lang); } catch (e) {} rebuildUI(); closeDlg(); showMenu(); const sels = overlay.querySelectorAll('.mrow select'); if (sels[1]) sels[1].focus(); });
  body.push(h('div', { class: 'mrow' }, h('label', null, t('theme') + ':', themeSel), h('label', null, t('lang') + ':', langSel)));
  const act = fn => () => { closeDlg(); fn(); };
  const mb = (label, fn, cls) => h('button', { class: cls || '', onclick: act(fn) }, label);
  body.push(h('div', { class: 'btns' },
    mb(t('find') + ' (Ctrl+F)', showFind), mb(t('infoTitle') + ' (Alt+Enter)', showInfo), mb(t('newFile') + ' (Shift+F4)', doNewFile), mb(t('install') + ' (I)', doInstall), mb(t('pkgQueue') + ' (Q)', showPkgQueue),
    mb(t('rename') + ' (Shift+F6)', doRename), mb(t('upload'), doUpload), mb(t('download'), doDownload),
    mb(t('roots') + ' (Ctrl+G)', () => gotoPath(panels[active])), mb(t('smbTitle') + ' (N)', showSmb), mb(t('logTitle'), showLog), mb(t('support'), showSupport), mb(t('help'), showHelp)));
  body.push(h('div', { class: 'rootbox' }, h('label', null, unsafeCb, t('unsafeBtn')), h('div', { class: 'kv', style: 'color:var(--warn)' }, t('unsafeWarn'))));
  dialog(t('menu'), body, [
    { label: t('quit'), bad: true, fn: () => confirmBox(t('quit'), t('quitQ'), t('quit'), doQuit, true) },
    { label: t('close'), primary: true, fn: closeDlg }]);
}
function showSupport() {
  const ru = lang === 'ru';
  dialog(t('support'), [h('div', { class: 'qrbox' }, h('img', { src: ru ? '__QR_RU__' : '__QR_EN__', alt: 'QR ' + t('supportCap') }), h('div', { class: 'kv' }, t('supportCap')))], [{ label: t('close'), primary: true, fn: closeDlg }]);
}
function setUnsafe(v) {
  unsafeMode = v;
  document.body.classList.toggle('unsafe', v);
  $('#unsafeTag').textContent = v ? t('unsafeOn') : '';
}
function showHelp() { dialog(t('helpTitle'), [t('helpBody')], [{ label: t('close'), primary: true, fn: closeDlg }]); }
async function doQuit() {
  try { await api('/quit', {}); } catch (e) {}
  dialog(null, [t('bye')], []);
}
function applyTheme() {
  document.documentElement.setAttribute('data-theme', theme === 'dark' || theme === 'light' ? theme : 'classic');
  RH = theme === 'classic' ? 20 : 32;   // в современных темах строки выше
  document.documentElement.style.setProperty('--row-h', RH + 'px');
  if (typeof panels !== 'undefined') for (const p of panels) {
    if (!p || !p.view || !p.spacer) continue;
    p.spacer.style.height = (p.view.length * RH) + 'px';
    p.rows.forEach(r => r.remove());
    p.rows.clear();
    ensureVisible(p);
    render(p);
  }
}

// ---------- нижняя строка клавиш ----------
const KEYS = [
  ['1', 'help', showHelp], ['2', 'refresh', () => refreshAll()], ['3', 'view', () => { const p = panels[active]; const e = p.view[p.cur]; if (e && e.t === 'f') viewFile(p, e); }],
  ['4', 'edit', doEdit], ['5', 'copy', () => doCopyMove(false)], ['6', 'move', () => doCopyMove(true)], ['7', 'mkdir', doMkdir],
  ['8', 'del', doDelete], ['9', 'chmod', doChmod], ['10', 'menu', showMenu]
];
function buildKeys() {
  const k = $('#keys');
  k.replaceChildren(...KEYS.map(([n, key, fn]) => h('button', { onclick: () => { if (!dlgOpen()) fn(); } }, h('i', null, n), t(key))));
  if (matchMedia('(max-width:760px)').matches) {
    k.append(h('button', { onclick: () => { if (!dlgOpen()) toggleSel(panels[active], panels[active].cur, true); } }, h('i', null, '+'), t('select')),
      h('button', { onclick: () => { if (!dlgOpen()) setActive(1 - active); } }, h('i', null, '⇄'), t('swap')),
      h('button', { onclick: () => { if (!dlgOpen()) doUpload(); } }, h('i', null, '↑'), t('upload')),
      h('button', { onclick: () => { if (!dlgOpen()) doDownload(); } }, h('i', null, '↓'), t('download')),
      h('button', { onclick: () => { if (!dlgOpen()) showRoots(); } }, h('i', null, '/'), t('roots')),
      h('button', { onclick: () => { if (!dlgOpen()) showFind(); } }, h('i', null, '?'), t('find')),
      h('button', { onclick: () => { if (!dlgOpen()) doRename(); } }, h('i', null, 'R'), t('rename')));
  }
}
function rebuildUI() {
  document.documentElement.lang = lang;
  buildKeys();
  $('#btnMenu').textContent = t('menu') + ' (F10)';
  $('#unsafeTag').textContent = unsafeMode ? t('unsafeOn') : '';
  panels.forEach(p => {
    p.ch.children[1].textContent = t('name'); p.ch.children[2].textContent = t('size');
    p.ch.children[3].textContent = t('date'); p.ch.children[4].textContent = t('attr');
    render(p); updateFoot(p);
  });
}
$('#btnMenu').addEventListener('click', () => { if (!dlgOpen()) showMenu(); });

// ---------- клавиатура ----------
document.addEventListener('keydown', ev => {
  if (dlgOpen()) {
    if (ev.key === 'Escape') { ev.preventDefault(); closeDlg(); }
    else if (ev.key === 'Enter' && ev.target.tagName !== 'INPUT' && ev.target.tagName !== 'BUTTON' && ev.target.tagName !== 'SELECT') {
      const b = overlay.querySelector('button.primary'); if (b) { ev.preventDefault(); b.click(); }
    }
    return;
  }
  const p = panels[active];
  const fk = /^F\d+$/.test(ev.key);
  let handled = true;
  switch (ev.key) {
    case 'ArrowUp': moveCur(p, -1); break;
    case 'ArrowDown': moveCur(p, 1); break;
    case 'PageUp': moveCur(p, -Math.max(1, Math.floor(p.list.clientHeight / RH) - 1)); break;
    case 'PageDown': moveCur(p, Math.max(1, Math.floor(p.list.clientHeight / RH) - 1)); break;
    case 'Home': moveCur(p, -1e9); break;
    case 'End': moveCur(p, 1e9); break;
    case 'Enter': if (ev.altKey) showInfo(); else openCur(p); break;
    case 'Backspace': goUp(p); break;
    case 'Tab': setActive(1 - active); break;
    case 'Insert': toggleSel(p, p.cur, true); break;
    case ' ': toggleSel(p, p.cur, true); break;
    case '+': selectByMask(true); break;
    case '-': selectByMask(false); break;
    case '*': p.view.forEach(e => { if (!e.up) { if (p.sel.has(e.n)) p.sel.delete(e.n); else p.sel.add(e.n); } }); render(p); updateFoot(p); break;
    case 'Delete': doDelete(); break;
    case 'a': case 'A': if (ev.ctrlKey || ev.metaKey) { p.view.forEach(e => { if (!e.up) p.sel.add(e.n); }); render(p); updateFoot(p); } else handled = false; break;
    case 'f': case 'F': if (ev.ctrlKey || ev.metaKey) showFind(); else handled = false; break;
    case 'd': case 'D': if (ev.ctrlKey || ev.metaKey) doDownload(); else handled = false; break;
    case 'g': case 'G': if (ev.ctrlKey || ev.metaKey) gotoPath(p); else handled = false; break;
    case 'Escape': showMenu(); break;
    case 'F1': showHelp(); break;
    case 'F2': refreshAll(); break;
    case 'F3': { const e = p.view[p.cur]; if (e && e.t === 'f') viewFile(p, e); break; }
    case 'i': case 'I': doInstall(); break;
    case 'q': case 'Q': if (!ev.ctrlKey && !ev.metaKey && !ev.altKey) showPkgQueue(); else handled = false; break;
    case 'n': case 'N': if (!ev.ctrlKey && !ev.metaKey && !ev.altKey) showSmb(); else handled = false; break;
    case 'F4': if (ev.shiftKey) doNewFile(); else doEdit(); break;
    case 'F5': doCopyMove(false); break;
    case 'F6': if (ev.shiftKey) doRename(); else doCopyMove(true); break;
    case 'F7': if (ev.altKey) showFind(); else doMkdir(); break;
    case 'F8': doDelete(); break;
    case 'F9': doChmod(); break;
    case 'F10': showMenu(); break;
    default: handled = false;
  }
  if (handled || fk) ev.preventDefault();
});
window.addEventListener('resize', () => panels.forEach(p => { render(p); }));

// ---------- запуск ----------
async function init() {
  applyTheme();
  await initLang();
  const pn = $('#panels');
  panels.push(makePanel(0), makePanel(1));
  pn.append(panels[0].el, panels[1].el);
  rebuildUI();
  setupDrop();
  setActive(0);
  let roots = ['/'], rootInfo = [], st = {};
  try {
    const j = await api('/api/roots');
    rootInfo = j.roots;
    roots = j.roots.map(r => r.p);
    if (j.version) $('#ver').textContent = j.version;
  } catch (e) { say(t('noConn'), true); }
  try { st = await api('/api/state'); } catch (e) {}
  // тема хранится на консоли и применяется при каждом запуске на любом устройстве
  if (st.theme === 'classic' || st.theme === 'dark' || st.theme === 'light') {
    theme = st.theme;
    applyTheme();
  }
  // левая: сохранённая, иначе /data; правая: сохранённая (если диск подключён), иначе первый подключённый USB/HDD
  const usb = rootInfo.filter(r => isDiskPath(r.p));
  const usbDef = (usb.find(r => r.mnt) || usb[0] || {}).p;
  const leftDef = roots.includes('/data') ? '/data' : roots[0];
  const rightDef = usbDef || (roots.includes('/') ? '/' : roots[0]);
  if (!(st.l && await load(panels[0], st.l, null, true))) await load(panels[0], leftDef, null);
  // правая: последняя открытая; если это был отключённый USB/HDD, панель остаётся пустой
  const diskUp = p => usb.some(r => p === r.p || p.startsWith(r.p + '/'));
  if (st.r && isDiskPath(st.r) && !diskUp(st.r)) { panels[1].head.firstChild.textContent = ''; }
  else if (!(st.r && await load(panels[1], st.r, null, true))) await load(panels[1], rightDef, null);
  stateReady = true;
  panels[0].list.focus();
}
init();
</script>
