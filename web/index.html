<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PS4 Commander</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%2300007a'/%3E%3Crect x='4' y='6' width='11' height='20' fill='none' stroke='%2355ffff' stroke-width='2'/%3E%3Crect x='17' y='6' width='11' height='20' fill='none' stroke='%2355ffff' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #00007a; --panel: #0000a8; --border: #55ffff; --text: #a8a8ff; --dir: #ffffff;
  --sel: #ffff55; --cur-bg: #00a8a8; --cur-fg: #000000; --dim: #7a7ac8; --bar-bg: #00a8a8; --bar-fg: #000000;
  --bar-num: #a8a8a8; --bar-num-fg: #000000; --warn: #ff5555; --ok: #55ff55; --dlg-bg: #a8a8a8; --dlg-fg: #000000;
  --dlg-border: #ffffff; --input-bg: #000000; --input-fg: #55ffff; --danger-bg: #5a0000;
}
:root[data-theme="dark"] {
  --bg: #12151c; --panel: #171b24; --border: #3a4a63; --text: #c9d1e0; --dir: #ffffff;
  --sel: #ffd166; --cur-bg: #2a3b57; --cur-fg: #ffffff; --dim: #7d8aa3; --bar-bg: #1f2633; --bar-fg: #dfe6f3;
  --bar-num: #3a4a63; --bar-num-fg: #ffffff; --warn: #ff6b6b; --ok: #6bdc8b; --dlg-bg: #202838; --dlg-fg: #e6ecf7;
  --dlg-border: #5a6c8c; --input-bg: #0f131a; --input-fg: #e6ecf7; --danger-bg: #3a1217;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 15px/20px ui-monospace, "DejaVu Sans Mono", Consolas, "Liberation Mono", monospace; overflow: hidden; }
#app { height: 100%; display: flex; flex-direction: column; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); gap: 6px; }
#top { display: flex; align-items: center; gap: 10px; color: var(--border); flex: none; }
#top b { color: var(--dir); }
#top .sp { flex: 1; }
#dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); display: inline-block; }
#dot.off { background: var(--warn); }
button { font: inherit; cursor: pointer; }
.tb { background: transparent; color: var(--border); border: 1px solid var(--border); padding: 0 10px; height: 26px; }
.tb:hover { background: var(--cur-bg); color: var(--cur-fg); }
#unsafeTag { color: var(--warn); font-weight: bold; display: none; }
body.unsafe #unsafeTag { display: inline; }
#panels { flex: 1; min-height: 0; display: flex; gap: 6px; }
.panel { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--panel);
  border: 2px double var(--border); }
.panel.active .ph { background: var(--cur-bg); color: var(--cur-fg); }
.panel.danger1 { background: var(--danger-bg); }
.ph { text-align: center; color: var(--dir); padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; flex: none; cursor: pointer; }
.ph span { direction: ltr; unicode-bidi: plaintext; }
.ch { display: flex; color: var(--border); border-bottom: 1px solid var(--border); flex: none; user-select: none; }
.ch div { cursor: pointer; padding: 0 4px; }
.col-m { width: 26px; } .col-n { flex: 1; min-width: 0; } .col-s { width: 82px; text-align: right; } .col-d { width: 138px; } .col-a { width: 46px; text-align: center; }
.list { position: relative; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; outline: none; }
.spacer { position: absolute; left: 0; top: 0; width: 1px; }
.row { position: absolute; left: 0; right: 0; height: 20px; display: flex; white-space: nowrap; cursor: default; }
.row > div { padding: 0 4px; overflow: hidden; text-overflow: ellipsis; }
.row.dir .col-n { color: var(--dir); font-weight: bold; }
.row.link .col-n { color: var(--ok); }
.row.sel .col-n, .row.sel .col-s { color: var(--sel); font-weight: bold; }
.row.cur { background: var(--cur-bg); }
.row.cur > div { color: var(--cur-fg) !important; }
.row .col-m { text-align: center; color: var(--sel); }
.row .col-s, .row .col-d, .row .col-a { color: var(--dim); }
.pf { border-top: 1px solid var(--border); color: var(--border); padding: 0 6px; display: flex; justify-content: space-between; gap: 10px; flex: none; white-space: nowrap; overflow: hidden; }
#msg { flex: none; min-height: 20px; color: var(--sel); padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#keys { flex: none; display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }
#keys button { border: 0; background: var(--bar-bg); color: var(--bar-fg); height: 28px; padding: 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; justify-content: flex-start; }
#keys button i { font-style: normal; background: var(--bar-num); color: var(--bar-num-fg); padding: 0 4px; height: 100%; display: inline-flex; align-items: center; }
#keys button:hover { filter: brightness(1.15); }
#overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 10; padding: 10px; }
#overlay.on { display: flex; }
.dlg { background: var(--dlg-bg); color: var(--dlg-fg); border: 3px double var(--dlg-border); padding: 10px 14px; min-width: min(420px, 92vw); max-width: min(900px, 96vw); max-height: 92vh; display: flex; flex-direction: column; gap: 8px; box-shadow: 8px 8px 0 rgba(0,0,0,.5); }
.dlg.wide { width: min(960px, 96vw); height: 86vh; }
.dlg.err { background: #aa0000; color: #fff; }
.dlg h3 { margin: 0; text-align: center; font-size: 15px; }
.dlg .body { overflow: auto; white-space: pre-wrap; word-break: break-word; min-height: 0; }
.dlg input[type=text] { width: 100%; background: var(--input-bg); color: var(--input-fg); border: 1px solid var(--dlg-border); padding: 3px 6px; font: inherit; }
.dlg label { display: flex; gap: 6px; align-items: center; }
.btns { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.btns button { background: var(--bar-bg); color: var(--bar-fg); border: 1px solid var(--dlg-border); padding: 2px 16px; min-height: 28px; }
.btns button.primary { font-weight: bold; outline: 2px solid var(--dlg-fg); }
.btns button.bad { background: #aa0000; color: #fff; }
.bar { height: 16px; background: var(--input-bg); border: 1px solid var(--dlg-border); }
.bar i { display: block; height: 100%; background: var(--cur-bg); width: 0; }
.viewer { flex: 1; min-height: 0; overflow: auto; background: var(--input-bg); color: var(--input-fg); padding: 6px; font-size: 13px; line-height: 17px; white-space: pre; margin: 0; }
.kv { color: var(--dim); }
@media (max-width: 760px) {
  #panels { flex-direction: column; }
  .col-d, .col-a { display: none; }
  #keys { grid-template-columns: repeat(5, 1fr); }
  #keys button { height: 34px; }
  html, body { font-size: 14px; }
}
</style>
</head>
<body>

  <div id="top">
    <span><b>PS4 Commander</b> <span id="ver">__VERSION__</span></span>
    <span id="dot" title=""></span>
    <span id="unsafeTag"></span>
    <span class="sp"></span>
    <button class="tb" id="btnMenu"></button>
  </div>
  <div id="panels"></div>
  <div id="msg"></div>
  <div id="keys"></div>
</div>
<div id="overlay"></div>
<input type="file" id="file" multiple style="display:none">

let theme = 'classic';
try { const s = localStorage.getItem('fm_theme'); if (s === 'dark' || s === 'classic') theme = s; } catch (e) {}
function t(k, p) {
  let s = (TR[lang] && TR[lang][k]) ?? TR.en[k] ?? k;
  if (p) for (const q in p) s = s.split('{' + q + '}').join(p[q]);
  return s;
}
function errText(code) { return t('e_' + code) !== 'e_' + code ? t('e_' + code) : (code && /^E[A-Z0-9]+$/.test(code) ? code : t('e_generic') + (code ? ': ' + code : '')); }

// ---------- вспомогательное ----------
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] === true) e.setAttribute(k, '');
    else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
function fmtSize(n) {
  if (n < 1024) return n + ' B';
  const u = ['KB', 'MB', 'GB', 'TB'];
  let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2)) + ' ' + u[i];
}
function fmtDate(sec) {
  if (!sec) return '';
  const d = new Date(sec * 1000), p = x => String(x).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function fmtTime(s) { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60); return m ? m + ':' + String(s % 60).padStart(2, '0') : s + ' s'; }
function join(dir, name) { return dir === '/' ? '/' + name : dir + '/' + name; }
function baseName(p) { const i = p.lastIndexOf('/'); return i < 0 ? p : p.slice(i + 1); }
function parentOf(p) { const i = p.lastIndexOf('/'); return i <= 0 ? '/' : p.slice(0, i); }

let unsafeMode = false;
let busyUI = false;

async function api(path, body, method) {
  let r;
  try {
    const opts = body !== undefined ? { method: 'POST', headers: { 'X-Requested-With': 'ps4cmd', 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {};
    r = await fetch(path, opts);
  } catch (e) { setConn(false); throw Object.assign(new Error('noconn'), { code: 'noconn' }); }
  setConn(true);
  const txt = await r.text();
  let j = null;
  try { j = JSON.parse(txt); } catch (e) {}
  if (!r.ok) throw Object.assign(new Error((j && j.error) || 'http' + r.status), { code: (j && j.error) || 'http' + r.status });
  return j;
}
function setConn(ok) { $('#dot').classList.toggle('off', !ok); $('#dot').title = ok ? '' : t('noConn'); }
let msgTimer = 0;
function say(text, bad) {
  const m = $('#msg');
  m.textContent = text || '';
  m.style.color = bad ? 'var(--warn)' : 'var(--sel)';
  clearTimeout(msgTimer);
  if (text) msgTimer = setTimeout(() => { m.textContent = ''; }, 6000);
}

// ---------- панели ----------
const RH = 20;
const panels = [];

// ---------- задания ----------
let pollTimer = 0;
async function runJob(spec, titleKey) {
  spec.unsafe = unsafeMode;
  try { await api('/api/job/start', spec); }
  catch (e) { messageBox(errText(e.code), true); return; }

}
function showJob(titleKey) {
  const bar = h('i'), cur = h('div', { class: 'kv' }), stat = h('div'), state = h('div');
  const cancel = h('button', { class: 'bad', onclick: () => api('/api/job/cancel', {}).catch(() => {}) }, t('cancel'));
  const d = h('div', { class: 'dlg' }, h('h3', null, t(titleKey)), h('div', { class: 'bar' }, bar), state, stat, cur, h('div', { class: 'btns' }, cancel));
  openDlg(d, () => clearTimeout(pollTimer));
  const tick = async () => {
    let j;
    try { j = await api('/api/job'); } catch (e) { pollTimer = setTimeout(tick, 1000); return; }
    const pct = j.total > 0 ? Math.min(100, 100 * j.done / j.total) : (j.files_total > 0 ? 100 * j.files_done / j.files_total : 0);
    bar.style.width = pct.toFixed(1) + '%';
    state.textContent = j.state === 'scan' ? t('scanning') : pct.toFixed(0) + '%';
    stat.textContent = j.files_done + ' / ' + j.files_total + ' ' + t('files') + (j.total > 0 ? '   ' + fmtSize(j.done) + ' / ' + fmtSize(j.total) : '') +
      '\n' + t('elapsed') + ': ' + fmtTime(j.secs) + (j.secs > 1 && j.done > 0 ? '   ' + t('speed') + ': ' + fmtSize(j.done / j.secs) + '/s' : '');
    stat.style.whiteSpace = 'pre';
    cur.textContent = j.cur;
    if (j.state === 'scan' || j.state === 'running') { pollTimer = setTimeout(tick, 400); return; }
    closeDlg();
    await refreshAll();
    if (j.err_total > 0) {
      const lines = j.errors.map(x => x.p + '\n    ' + errText(x.e));
      if (j.err_total > j.errors.length) lines.push('... +' + (j.err_total - j.errors.length));
      dialog((j.state === 'cancelled' ? t('cancelled') + ': ' : '') + t('errorsTitle') + ' (' + j.err_total + ')', [lines.join('\n')], [{ label: t('ok'), primary: true, fn: closeDlg }], 'err wide');
    } else if (j.state === 'cancelled') say(t('cancelled'));
    else say(t('done'));
  };
  tick();
}

function globToRe(mask) {
  const re = mask.replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*').replace(/\?/g, '.');
  return new RegExp('^' + re + '$', 'i');
}

  askInput(add ? '+' : '-', t(add ? 'maskSel' : 'maskDesel'), '*', null, mask => {
    mask = mask.trim();
    if (!mask) return;
    let re;
    try { re = globToRe(mask); } catch (e) { return; }
    p.view.forEach(e => { if (!e.up && re.test(e.n)) { if (add) p.sel.add(e.n); else p.sel.delete(e.n); } });
    render(p); updateFoot(p);
  });
}

  const p = panels[active];
  const inp = h('input', { type: 'text', spellcheck: 'false', autocomplete: 'off', autocapitalize: 'off' });
  const res = h('div', { style: 'max-height:50vh;overflow:auto;display:flex;flex-direction:column;gap:2px' });
  const note = h('div', { class: 'kv', style: 'color:inherit' });
  const run = async () => {
    const q = inp.value.trim();
    if (!q) return;
    res.replaceChildren(h('div', null, t('loading')));
    note.textContent = '';
    try {
      const j = await api('/api/find?path=' + encodeURIComponent(p.path) + '&q=' + encodeURIComponent(q));
      res.replaceChildren();
      if (!j.results.length) res.append(h('div', null, t('noResults')));
      for (const r of j.results) {
        res.append(h('button', { style: 'text-align:left;background:transparent;border:0;color:inherit;padding:1px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap', title: r.p, onclick: async () => {
          closeDlg();
          const dir = r.t === 'd' ? r.p : parentOf(r.p);
          await load(p, dir, null);
          if (r.t !== 'd') { const i = p.view.findIndex(x => x.n === baseName(r.p)); if (i >= 0) { p.cur = i; ensureVisible(p); render(p); updateFoot(p); } }
        } }, (r.t === 'd' ? '/' : '') + r.p + (r.t === 'f' ? '  (' + fmtSize(r.s) + ')' : '')));
      }
      note.textContent = t('scannedN', { n: j.scanned }) + (j.trunc ? '. ' + t('truncNote') : '');
    } catch (e) { res.replaceChildren(h('div', null, errText(e.code))); }
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); run(); } });
  dialog(t('findTitle'), [h('div', null, t('findLabel')), inp, res, note], [{ label: t('searchBtn'), primary: true, fn: run }, { label: t('close'), fn: closeDlg }], 'wide');
  inp.focus();
}

// ---------- редактор текста ----------
async function editFile(p, e, createNew) {
  const path = join(p.path, e.n);
  let text = '', crlf = false;
  if (!createNew) {
    if (e.t !== 'f') return;
    if (e.s > 1048576) { messageBox(t('tooBig'), true); return; }
    try {
      const r = await fetch('/api/view?path=' + encodeURIComponent(path) + '&off=0&len=1048576');
      if (!r.ok) { let c = 'http' + r.status; try { c = (await r.json()).error || c; } catch (x) {} throw Object.assign(new Error(c), { code: c }); }
      const buf = new Uint8Array(await r.arrayBuffer());
      for (let i = 0; i < Math.min(buf.length, 8192); i++) if (buf[i] === 0) { messageBox(t('binaryNoEdit'), true); return; }
      text = new TextDecoder('utf-8').decode(buf);
    } catch (er) { messageBox(errText(er.code), true); return; }
    crlf = text.includes('\r\n');
  }
  const ta = h('textarea', { class: 'viewer', spellcheck: 'false', style: 'resize:none;white-space:pre;overflow:auto;width:100%;font:inherit;font-size:13px;line-height:17px;border:0;outline:0' });
  ta.value = crlf ? text.replace(/\r\n/g, '\n') : text;
  const st = h('div', { class: 'kv' }, fmtSize(new Blob([text]).size));
  let dirty = false;
  ta.addEventListener('input', () => { dirty = true; st.textContent = '*'; });
  const save = async () => {
    const body = crlf ? ta.value.replace(/\n/g, '\r\n') : ta.value;
    try { await putFile(path, new Blob([body]), !createNew || dirty, null); dirty = false; createNew = false; st.textContent = t('saved') + ' (' + fmtSize(new Blob([body]).size) + ')'; await load(p, p.path, e.n); }
    catch (er) { messageBox(errText(er.code), true); }
  };
  const close = () => { if (dirty) confirmBox(t('edit'), t('unsavedQ'), t('close'), closeDlg, true); else closeDlg(); };
  const d = h('div', { class: 'dlg wide' }, h('h3', null, e.n), st, ta, h('div', { class: 'btns' },
    h('button', { class: 'primary', onclick: save }, t('save') + ' (Ctrl+S)'), h('button', { onclick: close }, t('close'))));
  openDlg(d);
  ta.focus();
  d.addEventListener('keydown', ev => {
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's') { ev.preventDefault(); save(); }
    else if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); close(); }
    else if (ev.key === 'Tab') { ev.preventDefault(); const a = ta.selectionStart; ta.setRangeText('\t', a, ta.selectionEnd, 'end'); dirty = true; st.textContent = '*'; }
  });
}
function doEdit() { const p = panels[active], e = p.view[p.cur]; if (e && !e.up) editFile(p, e, false); }
function doNewFile() {
  const p = panels[active];
  askInput(t('newFile'), t('newFileName'), '', null, name => {
    name = name.trim();
    if (!name) return;
    if (p.entries.some(x => x.n === name)) { messageBox(t('exists'), true); return; }
    editFile(p, { n: name, t: 'f', s: 0 }, true);
  });
}

// ---------- установка PKG ----------
function doInstall(only) {
  const p = panels[active];
  const ts = (only && only.n ? [only] : targets(p)).filter(e => e.t === 'f' && /\.pkg$/i.test(e.n));
  if (!ts.length) { messageBox(t('pkgNone'), true); return; }
  const n = ts.length === 1 ? '"' + ts[0].n + '"' : ts.length + ' ' + t('items');
  confirmBox(t('install'), t('installQ', { n }), t('install'), async () => {
    try { await api('/api/pkg/install', { paths: ts.map(e => join(p.path, e.n)) }); }
    catch (e) { messageBox(errText(e.code), true); return; }
    showPkgQueue();
  });
}
function showPkgQueue() {
  const box = h('pre', { style: 'margin:0;white-space:pre-wrap;max-height:50vh;overflow:auto' });
  dialog(t('pkgTitle'), [box], [
    { label: t('cancel'), fn: () => { api('/api/pkg/cancel', {}).catch(() => {}); } },
    { label: t('close'), primary: true, fn: closeDlg }], 'wide');
  dlgClose = () => clearTimeout(pollTimer);
  const stName = { queued: 'stQueued', registering: 'stRegistering', installing: 'stInstalling', done: 'stDone', already_installed: 'stAlready', failed: 'stFailed', cancelled: 'stCancelled' };
  const tick = async () => {
    let j;
    try { j = await api('/api/pkg'); } catch (e) { pollTimer = setTimeout(tick, 1500); return; }
    box.textContent = j.items.slice(-30).map(i => {
      const pc = i.total > 0 ? ' ' + Math.min(100, Math.floor(100 * i.done / i.total)) + '%' : '';
      return i.n + '\n    ' + t(stName[i.st] || 'stQueued') + (i.st === 'installing' ? pc : '') + (i.msg ? '  ' + i.msg : '');
    }).join('\n');
    pollTimer = setTimeout(tick, 1000);
  };
  tick();
}

// ---------- переход по пути и журнал ----------
function gotoPath(p) {
  askInput(t('roots'), t('gotoLabel'), p.path, { okLabel: t('go') }, v => { v = v.trim(); if (v) load(p, v.startsWith('/') ? v : join(p.path, v), null); });
}
async function showLog() {
  let txt = '';
  try { txt = await (await fetch('/api/log?n=16384')).text(); } catch (e) { return; }
  dialog(t('logTitle'), [h('pre', { class: 'viewer', style: 'min-height:50vh' }, txt)], [{ label: t('close'), primary: true, fn: closeDlg }], 'wide');
}

// ---------- просмотр файла ----------
async function viewFile(p, e) {
  const path = join(p.path, e.n);
  const CH = 256 * 1024;
  let off = 0, mode = 'auto', size = e.s;
  const pre = h('pre', { class: 'viewer' }), info = h('div', { class: 'kv' });
  const ext = (e.n.split('.').pop() || '').toLowerCase();
  const media = ['png','jpg','jpeg','gif','webp','bmp'].includes(ext) ? 'img' : ['mp3','ogg','wav'].includes(ext) ? 'audio' : ['mp4','m4v','webm'].includes(ext) ? 'video' : '';
  const src = '/api/download?inline=1&path=' + encodeURIComponent(path);
  const bText = h('button', { onclick: () => { mode = 'text'; load1(); } }, t('viewText'));
  const bHex = h('button', { onclick: () => { mode = 'hex'; load1(); } }, t('viewHex'));
  const bPrev = h('button', { onclick: () => { off = Math.max(0, off - CH); load1(); } }, t('prev'));
  const bNext = h('button', { onclick: () => { if (off + CH < size) { off += CH; load1(); } } }, t('next'));
  const bDl = h('button', { onclick: doDownload }, t('download'));
  const bClose = h('button', { class: 'primary', onclick: closeDlg }, t('close'));
  const d = h('div', { class: 'dlg wide' }, h('h3', null, e.n), info, pre, h('div', { class: 'btns' }, bText, bHex, bPrev, bNext, bDl, bClose));
  openDlg(d);
  if (media) {
    pre.replaceChildren(media === 'img' ? h('img', { src, style: 'max-width:100%;max-height:100%;display:block;margin:auto' })
      : h(media, { src, controls: true, style: 'max-width:100%;max-height:100%;display:block;margin:auto' }));
    pre.style.display = 'flex'; pre.style.alignItems = 'center'; pre.style.whiteSpace = 'normal';
    info.textContent = fmtSize(e.s);
    bPrev.style.display = bNext.style.display = 'none';
  } else load1();
  async function load1() {
    pre.textContent = t('loading');
    try {
      const r = await fetch('/api/view?path=' + encodeURIComponent(path) + '&off=' + off + '&len=' + CH);
      if (!r.ok) { let c = 'http' + r.status; try { c = (await r.json()).error || c; } catch (x) {} throw Object.assign(new Error(c), { code: c }); }
      size = +r.headers.get('X-File-Size') || size;
      const buf = new Uint8Array(await r.arrayBuffer());
      let bin = false;
      for (let i = 0; i < Math.min(buf.length, 4096); i++) if (buf[i] === 0) { bin = true; break; }
      const m = mode === 'auto' ? (bin ? 'hex' : 'text') : mode;
      if (m === 'hex') {
        const lines = [];
        for (let i = 0; i < buf.length; i += 16) {
          let hx = '', as = '';
          for (let k = 0; k < 16; k++) {
            if (i + k < buf.length) { const b = buf[i + k]; hx += b.toString(16).padStart(2, '0') + ' '; as += b >= 32 && b < 127 ? String.fromCharCode(b) : '.'; } else hx += '   ';
            if (k === 7) hx += ' ';
          }
          lines.push((off + i).toString(16).padStart(8, '0') + '  ' + hx + ' ' + as);
        }
        pre.textContent = lines.join('\n');
      } else {
        pre.textContent = new TextDecoder('utf-8', { fatal: false }).decode(buf);
      }
      pre.style.display = ''; pre.style.whiteSpace = 'pre';
      info.textContent = fmtSize(size) + '   ' + off + '..' + (off + buf.length) + ' (' + m + ')';
      bPrev.disabled = off === 0; bNext.disabled = off + CH >= size;
    } catch (er) { pre.textContent = errText(er.code); }
  }
}

// ---------- переходы, меню, справка ----------
async function showRoots() {
  let j;
  try { j = await api('/api/roots'); } catch (e) { return; }
  const p = panels[active];
  const list = j.roots.map(r => h('button', { onclick: () => { closeDlg(); load(p, r.p, null); } }, r.p));
  const d = h('div', { class: 'dlg' }, h('h3', null, t('rootsTitle')), h('div', { class: 'btns' }, list), h('div', { class: 'btns' }, h('button', { onclick: () => { closeDlg(); gotoPath(p); } }, t('gotoLabel').replace(/:$/, '...')), h('button', { class: 'primary', onclick: closeDlg }, t('cancel'))));
  openDlg(d);
}
function showMenu() {
  const body = [];
  const unsafeCb = h('input', { type: 'checkbox' });
  unsafeCb.checked = unsafeMode;
  unsafeCb.addEventListener('change', () => { setUnsafe(unsafeCb.checked); });
  const themeSel = h('select', null, h('option', { value: 'classic' }, t('themeClassic')), h('option', { value: 'dark' }, t('themeDark')));
  themeSel.value = theme;
  themeSel.addEventListener('change', () => { theme = themeSel.value; applyTheme(); try { localStorage.setItem('fm_theme', theme); } catch (e) {} });
  const langSel = h('select', null, h('option', { value: 'en' }, 'English'), h('option', { value: 'ru' }, 'Русский'));
  langSel.value = lang;
  langSel.addEventListener('change', () => { lang = langSel.value; try { localStorage.setItem('fm_lang', lang); } catch (e) {} closeDlg(); rebuildUI(); });
  body.push(h('label', null, unsafeCb, t('unsafeBtn')), h('div', { class: 'kv', style: 'color:#600' }, t('unsafeWarn')),
    h('label', null, t('theme') + ':', themeSel), h('label', null, t('lang') + ':', langSel));
  const act = fn => () => { closeDlg(); fn(); };
  const mb = (label, fn, cls) => h('button', { class: cls || '', onclick: act(fn) }, label);
  body.push(h('div', { class: 'btns' },
    mb(t('find') + ' (Ctrl+F)', showFind), mb(t('infoTitle') + ' (Alt+Enter)', showInfo), mb(t('newFile') + ' (Shift+F4)', doNewFile), mb(t('install') + ' (I)', doInstall),
    mb(t('rename') + ' (Shift+F6)', doRename), mb(t('upload'), doUpload), mb(t('download'), doDownload),
    mb(t('roots') + ' (Ctrl+G)', () => gotoPath(panels[active])), mb(t('logTitle'), showLog), mb(t('help'), showHelp)));
  dialog(t('menu'), body, [
    { label: t('quit'), bad: true, fn: () => confirmBox(t('quit'), t('quitQ'), t('quit'), doQuit, true) },
    { label: t('close'), primary: true, fn: closeDlg }]);
}
function setUnsafe(v) {
  unsafeMode = v;
  document.body.classList.toggle('unsafe', v);
  $('#unsafeTag').textContent = v ? t('unsafeOn') : '';
}
function showHelp() { dialog(t('helpTitle'), [t('helpBody')], [{ label: t('close'), primary: true, fn: closeDlg }]); }
async function doQuit() {
  try { await api('/quit', {}); } catch (e) {}
  dialog(null, [t('bye')], []);
}
function applyTheme() { document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'classic'); }

// ---------- нижняя строка клавиш ----------
const KEYS = [
  ['1', 'help', showHelp], ['2', 'refresh', () => refreshAll()], ['3', 'view', () => { const p = panels[active]; const e = p.view[p.cur]; if (e && e.t === 'f') viewFile(p, e); }],
  ['4', 'edit', doEdit], ['5', 'copy', () => doCopyMove(false)], ['6', 'move', () => doCopyMove(true)], ['7', 'mkdir', doMkdir],
  ['8', 'del', doDelete], ['9', 'chmod', doChmod], ['10', 'menu', showMenu]
];
function buildKeys() {
  const k = $('#keys');
  k.replaceChildren(...KEYS.map(([n, key, fn]) => h('button', { onclick: () => { if (!dlgOpen()) fn(); } }, h('i', null, n), t(key))));
  if (matchMedia('(max-width:760px)').matches) {
    k.append(h('button', { onclick: () => { if (!dlgOpen()) toggleSel(panels[active], panels[active].cur, true); } }, h('i', null, '+'), t('select')),
      h('button', { onclick: () => { if (!dlgOpen()) setActive(1 - active); } }, h('i', null, '⇄'), t('swap')),
      h('button', { onclick: () => { if (!dlgOpen()) doUpload(); } }, h('i', null, '↑'), t('upload')),
      h('button', { onclick: () => { if (!dlgOpen()) doDownload(); } }, h('i', null, '↓'), t('download')),
      h('button', { onclick: () => { if (!dlgOpen()) showRoots(); } }, h('i', null, '/'), t('roots')),
      h('button', { onclick: () => { if (!dlgOpen()) showFind(); } }, h('i', null, '?'), t('find')),
      h('button', { onclick: () => { if (!dlgOpen()) doRename(); } }, h('i', null, 'R'), t('rename')));
  }
}
function rebuildUI() {
  document.documentElement.lang = lang;
  buildKeys();
  $('#btnMenu').textContent = t('menu') + ' (F10)';
  $('#unsafeTag').textContent = unsafeMode ? t('unsafeOn') : '';
  panels.forEach(p => {
    p.ch.children[1].textContent = t('name'); p.ch.children[2].textContent = t('size');
    p.ch.children[3].textContent = t('date'); p.ch.children[4].textContent = t('attr');
    render(p); updateFoot(p);
  });
}
$('#btnMenu').addEventListener('click', () => { if (!dlgOpen()) showMenu(); });

// ---------- клавиатура ----------
document.addEventListener('keydown', ev => {
  if (dlgOpen()) {
    if (ev.key === 'Escape') { ev.preventDefault(); closeDlg(); }
    else if (ev.key === 'Enter' && ev.target.tagName !== 'INPUT' && ev.target.tagName !== 'BUTTON' && ev.target.tagName !== 'SELECT') {
      const b = overlay.querySelector('button.primary'); if (b) { ev.preventDefault(); b.click(); }
    }
    return;
  }
  const p = panels[active];
  const fk = /^F\d+$/.test(ev.key);
  let handled = true;
  switch (ev.key) {
    case 'ArrowUp': moveCur(p, -1); break;
    case 'ArrowDown': moveCur(p, 1); break;
    case 'PageUp': moveCur(p, -Math.max(1, Math.floor(p.list.clientHeight / RH) - 1)); break;
    case 'PageDown': moveCur(p, Math.max(1, Math.floor(p.list.clientHeight / RH) - 1)); break;
    case 'Home': moveCur(p, -1e9); break;
    case 'End': moveCur(p, 1e9); break;
    case 'Enter': if (ev.altKey) showInfo(); else openCur(p); break;
    case 'Backspace': goUp(p); break;
    case 'Tab': setActive(1 - active); break;
    case 'Insert': toggleSel(p, p.cur, true); break;
    case ' ': toggleSel(p, p.cur, true); break;
    case '+': selectByMask(true); break;
    case '-': selectByMask(false); break;
    case '*': p.view.forEach(e => { if (!e.up) { if (p.sel.has(e.n)) p.sel.delete(e.n); else p.sel.add(e.n); } }); render(p); updateFoot(p); break;
    case 'Delete': doDelete(); break;
    case 'a': case 'A': if (ev.ctrlKey || ev.metaKey) { p.view.forEach(e => { if (!e.up) p.sel.add(e.n); }); render(p); updateFoot(p); } else handled = false; break;
    case 'f': case 'F': if (ev.ctrlKey || ev.metaKey) showFind(); else handled = false; break;
    case 'd': case 'D': if (ev.ctrlKey || ev.metaKey) doDownload(); else handled = false; break;
    case 'g': case 'G': if (ev.ctrlKey || ev.metaKey) gotoPath(p); else handled = false; break;
    case 'Escape': showMenu(); break;
    case 'F1': showHelp(); break;
    case 'F2': refreshAll(); break;
    case 'F3': { const e = p.view[p.cur]; if (e && e.t === 'f') viewFile(p, e); break; }
    case 'i': case 'I': doInstall(); break;
    case 'F4': if (ev.shiftKey) doNewFile(); else doEdit(); break;
    case 'F5': doCopyMove(false); break;
    case 'F6': if (ev.shiftKey) doRename(); else doCopyMove(true); break;
    case 'F7': if (ev.altKey) showFind(); else doMkdir(); break;
    case 'F8': doDelete(); break;
    case 'F9': doChmod(); break;
    case 'F10': showMenu(); break;
    default: handled = false;
  }
  if (handled || fk) ev.preventDefault();
});
window.addEventListener('resize', () => panels.forEach(p => { render(p); }));

// ---------- запуск ----------
async function init() {
  applyTheme();
  const pn = $('#panels');
  panels.push(makePanel(0), makePanel(1));
  pn.append(panels[0].el, panels[1].el);
  rebuildUI();
  setupDrop();
  setActive(0);
  let roots = ['/'];
  try {
    const j = await api('/api/roots');
    roots = j.roots.map(r => r.p);
    if (j.version) $('#ver').textContent = j.version;
  } catch (e) { say(t('noConn'), true); }
  const first = roots.includes('/data') ? '/data' : roots[0];
  await load(panels[0], first, null);
  await load(panels[1], roots.includes('/') ? '/' : roots[0], null);
  panels[0].list.focus();
}
init();
</script>
